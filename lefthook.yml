pre-commit:
  commands:
    lint-staged:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec eslint {staged_files} && pnpm exec prettier --check {staged_files}

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
